
name: Build MekanismTweaks 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - "1.20.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: "1.20.1"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew jar --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MekanismTweaks-1.20.1-1.2.2
          path: build/libs/*.jar
          if-no-files-found: error
